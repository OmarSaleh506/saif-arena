<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>كويني من تجارب طويق التفاعلية</title>
<script src="js/i18n.js"></script>
<link rel="stylesheet" href="css/fonts.css"><link rel="stylesheet" href="css/coin.css">
<style>
:root{--ink:#081A19;--cream:#F4F2EA}
*{box-sizing:border-box}html,body{overflow-x:hidden;max-width:100vw}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 18%,#1b5a55,#081A19 72%);color:var(--cream);font-family:Tajawal,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1.4rem;text-align:center}
h1{margin:0;font-size:1.8rem;font-weight:800}.sub{margin:0;color:#E8C77A;font-weight:700;font-size:1.15rem}.mute{color:#C7D3D1;font-size:1rem;margin:0}
.cn-stage{height:360px;width:100%;touch-action:none}.cn-stage .cn{--s:1.1}
.btns{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;margin-top:.4rem}
button,a.b{font:inherit;font-weight:800;font-size:1.1rem;padding:.9rem 1.7rem;border-radius:999px;border:none;background:#C9705F;color:#fff;cursor:pointer;text-decoration:none}
button.g{background:transparent;border:2px solid rgba(244,242,234,.4)}
.ok{color:#6FBF9A;min-height:1.4em;font-weight:700}
</style></head><body>
<h1>كوينك من تجارب طويق التفاعلية</h1><p class="sub" id="sub"></p>
<div class="cn-stage" id="st"></div>
<p class="mute">اسحب الكوين لتدويره، والمسها لتقلبها</p>
<div class="btns"><button id="sv">حفظ الصورة</button><button class="g" id="sh" hidden>مشاركة</button><a class="b" id="kp" href="pack/knowledge-pack.pdf" download="الحقيبة-المعرفية-GSTS.pdf" style="flex-basis:100%;text-align:center">حمّل الحقيبة المعرفية (PDF)</a><a class="b g" href="./">افتح تجارب طويق التفاعلية</a></div><p class="ok" id="ok"></p>
<script src="js/icons.js"></script><script>const I = n => `<span class="ic">${ICONS[n] || ''}</span>`;</script><script src="js/games-meta.js"></script><script src="js/coin.js"></script>
<script>
const q = new URLSearchParams(location.search), g = GAMES.find(x => x.id === q.get('g')) || GAMES[0], tk = ['gold', 'silver', 'bronze'].includes(q.get('t')) ? q.get('t') : 'gold', score = Math.max(0, Math.min(2000, +q.get('s') || 0)), lvl = [1, 2, 3].includes(+q.get('l')) ? +q.get('l') : 0, scr = +q.get('c') === 2 ? 2 : 1, ser = Math.max(0, Math.min(9999, +q.get('n') || 0)) || undefined, CO = { scr, score, n: ser, lv: lvl };
document.getElementById('sub').textContent = `${g.badge} · ${lvl ? 'الصعوبة ' + COIN_LV[lvl][0] + ' · ' : ''}المستوى ${({ gold: 'الذهبي', silver: 'الفضي', bronze: 'البرونزي' })[tk]}${score ? ' · ' + score + ' نقطة' : ''}`;
const st = document.getElementById('st'); st.innerHTML = coinHTML(g, tk, 'lg', true, CO); const cn = st.querySelector('.cn'), wrap = st.querySelector('.cn-wrap'); wrap.classList.add('drop');
let ang = 0, drag = null, auto = true; cn.classList.add('flip'); setTimeout(() => { cn.classList.remove('flip'); cn.style.animation = 'none'; ang = 0; spin(); }, 2500);
function spin() { let last = performance.now(); (function f(n) { const d = n - last; last = n; if (auto) ang += d * .06; cn.style.transform = `rotateY(${ang}deg)`; requestAnimationFrame(f); })(last); }
st.onpointerdown = e => { drag = { x: e.clientX, a: ang, t: performance.now(), m: 0 }; auto = false; st.setPointerCapture(e.pointerId); };
st.onpointermove = e => { if (!drag) return; drag.m += Math.abs(e.clientX - drag.x - (ang - drag.a) / .6); ang = drag.a + (e.clientX - drag.x) * .6; };
st.onpointerup = () => { if (drag && performance.now() - drag.t < 300 && Math.abs(ang - drag.a) < 6) ang = Math.round(ang / 180) * 180 + 180; drag = null; setTimeout(() => { auto = true; }, 1200); };
coinCelebrate(st, tk);
const ok = document.getElementById('ok');
document.getElementById('sv').onclick = async () => { const cv = await coinPng(g, tk, score, CO); cv.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'saif-coin.png'; a.click(); ok.textContent = 'تم حفظ الصورة في جوالك'; }, 'image/png'); };
if (navigator.canShare) { const s = document.getElementById('sh'); s.hidden = false; s.onclick = async () => { const cv = await coinPng(g, tk, score, CO); cv.toBlob(async b => { const f = new File([b], 'saif-coin.png', { type: 'image/png' }); try { if (navigator.canShare({ files: [f] })) await navigator.share({ files: [f], title: TRX('كوين مشاركتي في تجارب طويق التفاعلية'), text: TRX('أشاركك كوين مشاركتي في تجارب طويق التفاعلية 🏅\nأنهيت «' + g.badge + '» بصعوبة ' + (lvl ? COIN_LV[lvl][0] : '') + ' وكوين المستوى ' + COIN_TIER[tk][0] + ' ونتيجتي ' + score + ' نقطة.\nجرّب التحدي بنفسك وشوف كوينك: ' + location.origin) }); } catch (e) {} }); }; }
</script></body></html>
